apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hikma.fullname" . }}-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "hikma.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "hikma.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: node:24.14.0-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache git
              corepack enable
              git init /src
              cd /src
              git remote add origin https://github.com/GliaX/hikma-health-server.git
              git fetch --depth 1 origin {{ .Values.migrate.sourceSha }}
              git checkout FETCH_HEAD
              pnpm install --frozen-lockfile --ignore-scripts
              npx kysely migrate latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: DATABASE_URL
            - name: DB_SSL
              value: "true"
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: "false"
